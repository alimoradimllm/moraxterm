[package]
name = "moraxterm-linux-ui"
version = "0.1.28"
edition = "2021"
license = "MIT"
repository = "https://github.com/alimoradimllm/moraxterm"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
keyring = { version = "3", default-features = false, features = ["linux-native", "windows-native"] }
base64 = "0.22"
libc = "0.2"
moraxterm_core = { package = "moraxterm_core", path = "../../rust-core" }

[features]
custom-protocol = ["tauri/custom-protocol"]
default = ["custom-protocol"]
