[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "moraxterm"
version = "0.1.24"
description = "Clean-room Linux compatibility layer for sanitized Moraxterm sessions"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Hermes Workspace"}]
dependencies = []

[project.scripts]
moraxterm = "moraxterm_cli:main"
moraxterm-gui = "moraxterm_gui:main"

[tool.setuptools]
py-modules = [
  "moraxterm_cli",
  "moraxterm_config",
  "moraxterm_importer",
  "credential_store",
  "moraxterm_gui",
  "rdp_backend",
  "session_model",
  "session_store",
  "separams_schema",
  "ssh_backend",
  "telnet_serial_backend",
  "terminal_backend",
  "vnc_backend",
  "wsl_backend",
]
