[package]
name = "moraxterm_core"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Portable core for the clean-room Moraxterm compatibility layer"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
portable-pty = "0.9"
libc = "0.2"
anyhow = "1"
thiserror = "2"
argon2 = "0.5"
base64 = "0.22"
chacha20poly1305 = "0.10"
rand = "0.8"

[lib]
name = "moraxterm_core"
path = "src/lib.rs"

[dev-dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }

[[bin]]
name = "moraxterm-core"
path = "src/main.rs"
